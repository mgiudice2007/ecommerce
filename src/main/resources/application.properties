spring.application.name=vuelos-backend
server.port=8080

# MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/vuelosdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Subida de fotos. Sin esto Spring corta en 1MB y el error que devuelve es confuso.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

