spring.application.name=vuelos-backend
server.port=8080

# MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/vuelosdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
jwt.secret=${JWT_SECRET:Z336MDO4GcjeNgTj6HvcGu0/naWQktnxHQoG2evIiS8=}
jwt.expiration-ms=86400000

# CORS: origenes del frontend (Vite usa 5173 por defecto)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Millas: por cada $250 pagados se suma 1 milla por el multiplicador de la clase
# (Economica 1, Ejecutiva 2, Primera 3, guardado en la tabla clases).
# Al usarlas para pagar, cada milla descuenta $10. Asi en Economica se recupera
# alrededor del 4% de lo pagado, parecido a los programas de las aerolineas.
millas.pesos-por-milla=250
millas.valor-en-pesos=10

# Cancelacion: como en las aerolineas, una compra se puede cancelar hasta 24 horas
# antes de que salga su primer vuelo. Despues ya no.
ordenes.horas-para-cancelar=24

# Mail de confirmacion de compra (spring-boot-starter-mail).
# Por defecto apunta a un SMTP de prueba local (MailHog / smtp4dev en el puerto 1025).
# Para Mailtrap o Gmail NO se escriben las credenciales aca: se pasan por variables de entorno
# (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_AUTH, MAIL_STARTTLS). Ver docs/API.md.
# Si el mail falla la compra se confirma igual; MAIL_HABILITADO=false lo apaga del todo.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.habilitado=${MAIL_HABILITADO:true}
mail.remitente=${MAIL_REMITENTE:no-reply@bcaairlines.com}
