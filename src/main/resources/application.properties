spring.application.name=vuelos-backend
server.port=8080

# MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/vuelosdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Fotos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
jwt.secret=${JWT_SECRET:Z336MDO4GcjeNgTj6HvcGu0/naWQktnxHQoG2evIiS8=}
jwt.expiration-ms=86400000

# CORS: origenes del frontend (Vite usa 5173 por defecto)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Millas: por cada $100 pagados se suma 1 milla por el multiplicador de la clase
# (Economica 1, Ejecutiva 2, Primera 3, guardado en la tabla clases).
# Al usarlas para pagar, cada milla descuenta $1.
millas.pesos-por-milla=100
millas.valor-en-pesos=1
