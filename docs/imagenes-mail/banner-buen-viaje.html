<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:440px;overflow:hidden;font-family:'Plus Jakarta Sans',Arial,sans-serif}
  .cielo{position:relative;width:1200px;height:440px;
    background:linear-gradient(180deg,#041e42 0%,#0b3a74 38%,#c2410c 78%,#ff9a3c 100%);}
  .sol{position:absolute;right:170px;bottom:-120px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,#ffd29a 0%,#ffb05c 45%,rgba(255,154,60,0) 70%);}
  .estrella{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.7}
  .nube{position:absolute;height:28px;border-radius:28px;background:rgba(255,255,255,.14)}
  .texto{position:absolute;left:72px;top:140px;color:#fff}
  .rotulo{display:inline-block;padding:8px 18px;border-radius:30px;background:rgba(255,255,255,.14);
    font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#ffd29a}
  h1{margin:22px 0 10px;font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-1px}
  p{margin:0;font-size:26px;font-weight:500;color:#ffe3c4}
  svg{position:absolute;left:0;top:0}
</style></head>
<body><div class="cielo">
  <div class="estrella" style="left:620px;top:40px"></div>
  <div class="estrella" style="left:760px;top:90px;opacity:.5"></div>
  <div class="estrella" style="left:900px;top:30px"></div>
  <div class="estrella" style="left:1080px;top:70px;opacity:.5"></div>
  <div class="estrella" style="left:1150px;top:150px"></div>
  <div class="estrella" style="left:540px;top:120px;opacity:.4"></div>
  <div class="sol"></div>
  <div class="nube" style="left:690px;top:300px;width:190px"></div>
  <div class="nube" style="left:760px;top:318px;width:120px"></div>
  <div class="nube" style="left:980px;top:250px;width:150px"></div>
  <svg width="1200" height="440" viewBox="0 0 1200 440">
    <path d="M640 400 C 760 150, 960 110, 1130 190" fill="none" stroke="#ffd29a" stroke-width="4"
          stroke-dasharray="4 14" stroke-linecap="round" opacity=".85"/>
    <circle cx="640" cy="400" r="9" fill="#fff"/>
    <circle cx="1130" cy="190" r="9" fill="#fff"/>
    <circle cx="1130" cy="190" r="18" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>
    <!-- avion sobre la ruta, apuntando hacia la derecha y apenas hacia arriba -->
    <g transform="translate(1010 150) rotate(8) scale(3.1) translate(-12 -12)">
      <path fill="#fff" d="M21 11.4c0-.8-.6-1.4-1.4-1.4h-4.2L11.2 3.5H9.4l2 6.5H7.2L5.8 8.1H4.3l.9 3.3-.9 3.3h1.5l1.4-1.9h4.2l-2 6.6h1.8l4.2-6.6h4.2c.8 0 1.4-.6 1.4-1.4z"/>
    </g>
  </svg>
  <div class="texto">
    <span class="rotulo">Embarque confirmado</span>
    <h1>¡Buen viaje!</h1>
    <p>Gracias por volar con BCA Airlines</p>
  </div>
</div></body></html>
